<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootcamp · Tracker en vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#F8F5EF;
  --white:#FFFFFF;
  --text:#1E1C24;
  --text2:#57545E;
  --gold:#FFD66B;
  --gold-text:#9C6A00;
  --teal:#1FD4A0;
  --teal-text:#0C7A5C;
  --blue:#4D9DFF;
  --purple:#8B8AE8;
  --orange:#FFA06B;
  --orange-text:#B5541C;
  --red:#ff6b6b;
  --pending:#5A5D96;
  --pending-soft:#75789E;
  --pending-dim:#A0A2C4;
  --dim:rgba(0,0,0,0.08);
}
html,body{width:100%;height:100%;background:var(--ink);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;width:100%;height:100vh;display:grid;grid-template-rows:76px 1fr 200px}

/* TOPBAR */
.topbar{display:flex;align-items:center;padding:0 36px;border-bottom:1px solid var(--dim);gap:18px}
.logos{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.logos img{height:48px;max-width:100%;object-fit:contain;object-position:left center;display:none}
.logos img.ok{display:block}
.logo-sep{width:48px;height:1px;background:rgba(0,0,0,.15);display:none}
.logo-sep.ok{display:block}
.t-logo{font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--gold-text);flex:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-live{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--teal-text);letter-spacing:.1em;text-transform:uppercase;padding:7px 16px;background:rgba(31,212,160,.12);border:1px solid rgba(31,212,160,.3);border-radius:20px;flex-shrink:0}
.t-live.stale{color:var(--orange-text);background:rgba(255,160,107,.14);border-color:rgba(255,160,107,.35)}
.t-dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.lang-wrap{display:flex;gap:3px;flex-shrink:0}
.lang-btn{padding:7px 14px;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;
  background:rgba(0,0,0,.035);border:1px solid rgba(0,0,0,.12);
  color:rgba(0,0,0,.45);letter-spacing:.06em;transition:all .15s;font-family:'DM Sans',sans-serif}
.lang-btn:hover{background:var(--text);color:var(--white)}
.lang-btn.active{background:rgba(255,214,107,.22);border-color:rgba(255,214,107,.5);color:var(--gold-text)}
.t-clock{font-size:15px;color:rgba(0,0,0,.4);letter-spacing:.04em;flex-shrink:0}

/* MAIN: 3 columns */
.main{display:grid;grid-template-columns:300px 1fr 280px;gap:0}

/* ── LEFT: % + narrative ── */
.left{
  padding:36px 34px;border-right:1px solid var(--dim);
  display:flex;flex-direction:column;justify-content:center;gap:28px;
}
.day-tag{font-size:14px;font-weight:700;color:var(--gold-text);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.day-tag::before{content:'';width:18px;height:2px;background:var(--gold-text)}

.pct-hero{
  font-family:'Fraunces',serif;
  font-size:84px;font-weight:900;line-height:.86;
  letter-spacing:-.03em;
  white-space:nowrap;
  background:linear-gradient(160deg,var(--text) 0%,var(--gold-text) 55%,var(--teal-text) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  transition:all .8s cubic-bezier(.4,0,.2,1);
}
.pct-label{font-size:15px;font-weight:600;color:rgba(0,0,0,.4);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

.prog-track{width:100%;height:4px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--purple),var(--gold),var(--teal));transition:width 1.4s cubic-bezier(.4,0,.2,1)}

.narrative{}
.n-label{font-size:14px;font-weight:700;color:rgba(0,0,0,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.n-head{font-family:'Fraunces',serif;font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.01em;margin-bottom:12px}
.n-head em{color:var(--gold-text);font-style:normal}
.n-sub{font-size:17px;color:rgba(0,0,0,.55);line-height:1.6;font-weight:300}

/* ── CENTER: nodes ── */
.center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;gap:16px;
  position:relative;
}
.graph-title{font-size:14px;font-weight:700;color:rgba(0,0,0,.35);letter-spacing:.12em;text-transform:uppercase}
svg#graph{overflow:visible}
.gnode-label{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600}
.gday-marker{font-family:'Fraunces',serif;font-size:13px;font-weight:700;letter-spacing:.06em}

/* ── RIGHT: objectives + ticker ── */
.right{
  border-left:1px solid var(--dim);
  padding:36px 30px;
  display:flex;flex-direction:column;gap:0;
}
.obj-label{font-size:14px;font-weight:700;color:rgba(0,0,0,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.obj-list{display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.obj{display:flex;align-items:flex-start;gap:14px;transition:all .4s}
.obj.pending{opacity:1}
.obj-icon{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;transition:all .5s}
.obj-icon.done{background:var(--teal);color:#000}
.obj-icon.active{background:transparent;border:1.5px solid var(--gold-text);color:var(--gold-text);animation:gp 2s ease-in-out infinite}
@keyframes gp{0%,100%{box-shadow:0 0 0 0 rgba(255,214,107,.4)}50%{box-shadow:0 0 10px 3px rgba(255,214,107,.18)}}
.obj-icon.pending{background:rgba(108,111,160,.08);border:1.5px solid var(--pending)}
.obj-text{font-size:17px;line-height:1.45}
.obj-text.done{color:var(--teal-text)}
.obj-text.active{color:var(--text);font-weight:500}
.obj-text.pending{color:var(--pending-soft)}

.ticker-box{margin-top:24px;background:var(--white);border:1px solid var(--dim);border-radius:10px;padding:16px 18px}
.ticker-tag{font-size:13px;font-weight:700;color:var(--teal-text);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.ticker-text{font-size:16px;color:rgba(0,0,0,.6);line-height:1.5}

/* ── BOTTOM: day timeline ── */
.bottom{
  border-top:1px solid var(--dim);
  display:grid;
  gap:1px;background:var(--dim);
}
.db{background:var(--ink);padding:18px 20px;cursor:default;pointer-events:none;transition:background .15s;position:relative;overflow:hidden}
.db::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:transparent;transition:background .3s}
.db.done::before{background:var(--teal)}
.db.active::before{background:var(--gold)}
.db:hover{background:rgba(0,0,0,.03)}
.db-n{font-size:13px;font-weight:700;letter-spacing:.08em;margin-bottom:7px;font-family:'Fraunces',serif}
.db.done .db-n{color:var(--teal-text)}
.db.active .db-n{color:var(--gold-text)}
.db.pending .db-n{color:var(--pending)}
.db-t{font-size:16px;font-weight:600;line-height:1.3;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db.done .db-t,.db.active .db-t{color:var(--text)}
.db.pending .db-t{color:var(--pending-soft)}
.db-o{font-size:13px;font-style:italic;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db.done .db-o{color:rgba(12,122,92,.7)}
.db.active .db-o{color:rgba(156,106,0,.65)}
.db.pending .db-o{color:var(--pending-dim)}
/* ── Contador de credenciales ── */
.cred-box{margin-top:20px;background:var(--white);border:1px solid var(--dim);border-radius:10px;padding:16px 18px;display:none}
.cred-box.on{display:block}
.cred-tag{font-size:13px;font-weight:700;color:var(--gold-text);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.cred-num{font-family:'Fraunces',serif;font-size:56px;font-weight:900;line-height:1;letter-spacing:-.02em;
  background:linear-gradient(160deg,var(--text),var(--gold-text) 60%,var(--teal-text));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:inline-block;transition:transform .3s}
.cred-num.bump{animation:bump .6s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ── Entidades por hito ── */
.ents{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ent{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);background:rgba(0,0,0,.04);border-radius:20px;padding:2px 10px 2px 2px}
.ent-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.ent-av img{width:100%;height:100%;object-fit:contain;background:#fff}
.obj.pending .ent{opacity:.55}
.obj.done .ent{background:rgba(31,212,160,.12);color:var(--teal-text)}

/* ── Celebración ── */
#confetti{position:fixed;inset:0;z-index:50;pointer-events:none}
.toast{position:fixed;left:50%;top:96px;transform:translate(-50%,-30px);opacity:0;z-index:60;pointer-events:none;
  background:var(--white);border:1px solid rgba(31,212,160,.4);border-radius:16px;padding:16px 26px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);display:flex;align-items:center;gap:16px;max-width:70vw;transition:all .5s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast-icon{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#000;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-k{font-size:13px;font-weight:700;color:var(--teal-text);letter-spacing:.12em;text-transform:uppercase}
.toast-t{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--text);line-height:1.2}

/* ── Selector de vista ── */
.view-wrap{display:flex;gap:0;flex-shrink:0;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.1);border-radius:20px;padding:3px}
.view-btn{padding:6px 14px;font-size:13px;font-weight:700;letter-spacing:.06em;border:0;border-radius:16px;cursor:pointer;background:transparent;color:rgba(0,0,0,.45);font-family:'DM Sans',sans-serif;transition:all .2s}
.view-btn.active{background:var(--text);color:var(--white)}

/* ── Vista recorrido ── */
.journey{position:absolute;left:0;right:0;top:76px;bottom:0;z-index:5;background:var(--ink);display:none;flex-direction:column;padding:34px 44px 36px;gap:18px}
body.view-journey .journey{display:flex}
.j-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.j-kicker{font-size:14px;font-weight:700;color:var(--gold-text);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.j-title{font-family:'Fraunces',serif;font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.j-logo{height:52px;max-width:280px;object-fit:contain;display:none}
.j-logo.ok{display:block}
.j-track{width:100%;height:60px;overflow:visible}
.j-days{flex:1;display:grid;gap:16px;min-height:0}
.j-day{position:relative;background:var(--white);border:1px solid var(--dim);border-radius:22px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  box-shadow:0 3px 40px rgba(0,0,0,.05);opacity:0;transform:translateY(18px)}
body.view-journey .j-day{animation:jin .6s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes jin{to{opacity:1;transform:none}}
.j-ghost{position:absolute;right:10px;top:-14px;font-family:'Fraunces',serif;font-size:120px;font-weight:900;color:rgba(0,0,0,.04);line-height:1;pointer-events:none}
.j-n{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--pending);font-family:'Fraunces',serif;display:flex;align-items:center;gap:8px}
.j-badge{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.1em;padding:3px 9px;border-radius:12px;text-transform:uppercase}
.j-day.active{border:1.5px solid var(--gold-text);box-shadow:0 10px 50px rgba(255,214,107,.35)}
.j-day.active .j-n{color:var(--gold-text)}
.j-day.active .j-badge{background:rgba(255,214,107,.3);color:var(--gold-text)}
.j-day.done .j-n{color:var(--teal-text)}
.j-day.done .j-badge{background:rgba(31,212,160,.15);color:var(--teal-text)}
.j-day.pending .j-badge{display:none}
.j-t{font-family:'Fraunces',serif;font-size:28px;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.j-sum{font-size:15px;color:var(--text2);line-height:1.5}
.j-list{display:flex;flex-direction:column;gap:9px;margin-top:4px;overflow:hidden}
.j-item{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;color:var(--text)}
.j-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:2px;border:1.5px solid var(--pending);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.j-item.done{color:var(--teal-text)}
.j-item.done .j-dot{background:var(--teal);border-color:var(--teal);color:#000}
.j-item.active .j-dot{border-color:var(--gold-text);box-shadow:0 0 0 4px rgba(255,214,107,.3)}
.j-item.active{font-weight:600}
.j-item.pending{color:var(--text2)}
.j-item .ents{margin-top:4px}

/* ── Pantalla completa ── */
.fs-btn{padding:7px 11px;font-size:15px;line-height:1;border-radius:6px;cursor:pointer;background:rgba(0,0,0,.035);border:1px solid rgba(0,0,0,.12);color:rgba(0,0,0,.5);flex-shrink:0}
.fs-btn:hover{background:var(--text);color:var(--white)}
body.fs .fs-btn{display:none}
body.fs.idle, body.fs.idle *{cursor:none !important}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="shell">

  <div class="topbar">
    <div class="t-logo" id="t-logo">Bootcamp</div>
    <div class="t-live" id="t-live"><div class="t-dot"></div><span id="t-live-label">Live</span></div>
    <div class="lang-wrap">
      <button class="lang-btn active" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" data-lang="id" onclick="setLang('id')">ID</button>
      <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" data-lang="pt" onclick="setLang('pt')">PT</button>
      <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
    </div>
    <div class="view-wrap">
      <button class="view-btn active" data-view="live" onclick="setView('live')">Live</button>
      <button class="view-btn" data-view="journey" onclick="setView('journey')">Journey</button>
    </div>
    <div class="t-clock" id="clock"></div>
    <button class="fs-btn" id="fs-btn" title="Fullscreen (F)" onclick="toggleFullscreen()">⛶</button>
  </div>

  <!-- VISTA RECORRIDO: el plan de la semana, día a día -->
  <div class="journey" id="journey">
    <div class="j-head">
      <div>
        <div class="j-kicker" id="j-kicker">—</div>
        <div class="j-title" id="j-title">—</div>
      </div>
      <img class="j-logo" id="j-logo" alt="">
    </div>
    <svg class="j-track" id="j-track" viewBox="0 0 1000 60" preserveAspectRatio="none"></svg>
    <div class="j-days" id="j-days"></div>
  </div>

  <div class="main">
    <!-- LEFT -->
    <div class="left">
      <div class="logos">
        <img id="logo-partner" alt="">
      </div>
      <div class="day-tag" id="day-tag">—</div>
      <div>
        <div class="pct-hero" id="pct-hero">0%</div>
        <div class="pct-label" id="pct-label">—</div>
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
      <div class="narrative">
        <div class="n-label" id="n-label">—</div>
        <div class="n-head" id="n-head">—</div>
        <div class="n-sub" id="n-sub">—</div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center">
      <div class="graph-title" id="graph-title">—</div>
      <svg id="graph" width="540" height="360" viewBox="0 0 540 360"></svg>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="obj-label" id="obj-label">—</div>
      <div class="obj-list" id="obj-list"></div>
      <div class="cred-box" id="cred-box">
        <div class="cred-tag" id="cred-tag">—</div>
        <div class="cred-num" id="cred-num">0</div>
      </div>
      <div class="ticker-box">
        <div class="ticker-tag" id="ticker-tag">—</div>
        <div class="ticker-text" id="ticker">—</div>
      </div>
    </div>
  </div>

  <div class="bottom" id="timeline"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   FUENTE DE DATOS — el ID real del Sheet (NO el link de "pub").
   Lo encuentras en la barra de direcciones cuando editas el Sheet:
   https://docs.google.com/spreadsheets/d/ESTE-ID-AQUI/edit#gid=0
   Los gid de cada pestaña son los mismos que ya nos diste.
   ══════════════════════════════════════════════════════════════ */
const SPREADSHEET_ID = '1ylaCzafQbYM5qHFsaEshitmgQ5aYhyd-_XBlss_Mmdw';
const CONFIG_GID = '0';
const MILESTONES_GID = '1007732509';

const REFRESH_MS = 30000;

/* Campos que el tracker reconoce en la pestaña `config` (todos opcionales) */
const CONFIG_DEFAULTS = { event_title: 'Bootcamp', event_location: '', event_dates: '' };

/* ── Textos de interfaz por idioma. El contenido que viene del Sheet
   (day_label, milestone, ticker, event_title...) NUNCA se traduce aquí,
   se muestra tal cual lo escribió el facilitador. ── */
const UI = {
  es: { live:'En vivo', stale:'Sin conexión', dayWord:'DÍA', dayOf:(a,b)=>`Día ${a} de ${b}`,
    whatsHappening:"Qué está pasando hoy", objectives:'Objetivos de hoy', journey:'El camino — paso a paso',
    lastUpdate:'Última actualización', inProgress:'En curso: ', completed:'Completado: ',
    waitingMilestone:'Todavía no empieza ningún hito de este día.', waitingTicker:'Esperando el próximo hito…',
    noData:'Sin datos todavía', noDataSub:'La pestaña milestones está vacía o no tiene filas válidas.',
    connError:'No se pudo conectar', connErrorSub:'Revisa que el Sheet siga publicado como CSV. Error: ',
    doneOf:(a,b)=>`${a}/${b} completados` },
  en: { live:'Live', stale:'Offline', dayWord:'DAY', dayOf:(a,b)=>`Day ${a} of ${b}`,
    whatsHappening:"What's happening today", objectives:"Today's objectives", journey:'The journey — step by step',
    lastUpdate:'Latest update', inProgress:'In progress: ', completed:'Completed: ',
    waitingMilestone:"No milestone for this day has started yet.", waitingTicker:'Waiting for the next milestone…',
    noData:'No data yet', noDataSub:'The milestones tab is empty or has no valid rows.',
    connError:'Could not connect', connErrorSub:'Check that the Sheet is still published as CSV. Error: ',
    doneOf:(a,b)=>`${a}/${b} completed` },
  pt: { live:'Ao vivo', stale:'Sem conexão', dayWord:'DIA', dayOf:(a,b)=>`Dia ${a} de ${b}`,
    whatsHappening:'O que está acontecendo hoje', objectives:'Objetivos de hoje', journey:'O caminho — passo a passo',
    lastUpdate:'Última atualização', inProgress:'Em andamento: ', completed:'Concluído: ',
    waitingMilestone:'Nenhum marco deste dia começou ainda.', waitingTicker:'Aguardando o próximo marco…',
    noData:'Ainda sem dados', noDataSub:'A aba milestones está vazia ou sem linhas válidas.',
    connError:'Não foi possível conectar', connErrorSub:'Verifique se a planilha continua publicada como CSV. Erro: ',
    doneOf:(a,b)=>`${a}/${b} concluídos` },
  fr: { live:'En direct', stale:'Hors ligne', dayWord:'JOUR', dayOf:(a,b)=>`Jour ${a} sur ${b}`,
    whatsHappening:"Ce qui se passe aujourd'hui", objectives:"Objectifs du jour", journey:'Le parcours — étape par étape',
    lastUpdate:'Dernière mise à jour', inProgress:'En cours : ', completed:'Terminé : ',
    waitingMilestone:"Aucune étape de ce jour n'a encore commencé.", waitingTicker:'En attente de la prochaine étape…',
    noData:'Pas encore de données', noDataSub:"L'onglet milestones est vide ou sans lignes valides.",

/* Links de Google Drive ("…/file/d/ID/view") no sirven como imagen: se
   convierten al endpoint de miniatura. El archivo debe estar compartido
   como "Cualquiera con el enlace". */
function toImageUrl(url) {
  const u = (url || '').trim();
  if (!u) return '';
  const m = u.match(/\/d\/([A-Za-z0-9_-]{10,})/) || u.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w600` : u;
}

  logosSet = true;
  const pairs = [['logo-partner', config.partner_logo_url, config.partner_name]];
  let shown = 0;
  pairs.forEach(([id, url, alt]) => {
    const img = document.getElementById(id);
    // Logos incrustados en el archivo: funcionan aunque Drive sea privado
    const src = EMBEDDED_LOGOS[id] || toImageUrl(url);
    if (!src) return;
    img.alt = alt || '';
    img.onload = () => { img.classList.add('ok'); shown++;  };
    img.onerror = () => console.warn('No se pudo cargar el logo (¿está compartido como público?):', url);
    img.src = src;
  });
}

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  tick();
  if (lastGoodModel) render(lastGoodModel);
  else applyStaticStrings();
}

function applyStaticStrings() {
  const t = UI[currentLang];
  document.getElementById('t-live-label').textContent = document.getElementById('t-live').classList.contains('stale') ? t.stale : t.live;
  document.getElementById('n-label').textContent = t.whatsHappening;
  document.getElementById('obj-label').textContent = t.objectives;
  document.getElementById('graph-title').textContent = t.journey;
  document.getElementById('ticker-tag').textContent = t.lastUpdate;
}

/* ── Carga una pestaña del Sheet vía JSONP (endpoint gviz de Google) ──
   No usa fetch(): inserta un <script> que Google rellena con una llamada
   a nuestra función de callback. Al ser un <script>, el navegador nunca
   aplica CORS — funciona directo contra Google, sin proxy ni backend. */
let _gvizSeq = 0;
function loadGvizTab(gid) {
  return new Promise((resolve, reject) => {
    const cbName = 'gvizCb_' + (_gvizSeq++) + '_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => { cleanup(); reject(new Error('tiempo de espera agotado')); }, 12000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
    }

    window[cbName] = function (resp) {
      try {
        if (!resp || !resp.table) throw new Error('respuesta sin tabla — revisa el gid');
        const cols = resp.table.cols.map(c => (c.label || c.id || '').trim().toLowerCase());
        const rows = resp.table.rows.map(r => {
          const obj = {};
          cols.forEach((key, i) => {
            const cell = r.c && r.c[i];
            obj[key] = (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v) : '';
          });
          return obj;
        });
        cleanup();
        resolve(rows);
      } catch (e) { cleanup(); reject(e); }
    };

    script.onerror = () => { cleanup(); reject(new Error('no se pudo cargar el Sheet — revisa que sea público ("Cualquiera con el link")')); };
    script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&headers=1&gid=${gid}&_ts=${Date.now()}`;
    document.head.appendChild(script);
  });
}

/* ── Traducción automática: el facilitador llena UNA sola columna, en
   el idioma que sea. El navegador traduce ese texto al vuelo cuando el
   participante cambia de idioma, usando el endpoint público de Google
   Translate (gratis, sin key, pensado para widgets embebidos en sitios).
   Se cachea por texto+idioma para no repetir llamadas de red. ── */
const translationCache = new Map();
async function translateText(text, targetLang) {
  const clean = (text || '').trim();
  if (!clean) return '';
  const key = targetLang + '::' + clean;
  if (translationCache.has(key)) return translationCache.get(key);
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(clean);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const translated = data[0].map(chunk => chunk[0]).join('');
    translationCache.set(key, translated);
    return translated;
  } catch (e) {
    console.warn('No se pudo traducir, muestro el original:', clean, e.message);
    translationCache.set(key, clean); // evita reintentar en cada render
    return clean;
  }
}
/* Traduce en lote todos los textos únicos que se necesitan para pintar
   esta pantalla, en paralelo, y devuelve una función tr(texto) lista. */
async function buildTranslator(texts, targetLang) {
  const unique = [...new Set(texts.filter(Boolean))];
  await Promise.all(unique.map(t => translateText(t, targetLang)));
  return (text) => translationCache.get(targetLang + '::' + (text || '').trim()) || text || '';
}

/* Acepta variantes en la columna status: "To do", "In progress", "Done",
   "Hecho", "En curso", "Selesai", etc. Todo lo no reconocido = pending. */
function normalizeStatus(raw) {
  const s = (raw || '').trim().toLowerCase();
  if (/^(done|completed?|complete|finished|hecho|listo|terminado|completado|conclu[ií]do|termin[ée]|selesai|✓|✔)/.test(s)) return 'done';
  if (/^(active|in progress|in-progress|doing|ongoing|current|now|en curso|en progreso|activo|em andamento|en cours|berlangsung|sedang)/.test(s)) return 'active';
  return 'pending';
}

/* ── Construye el modelo de datos a partir de las filas del Sheet ── */
function buildModel(configRows, milestoneRows) {
  const config = { ...CONFIG_DEFAULTS };
  configRows.forEach(r => {
    const field = (r.field || '').trim();
    if (field) config[field] = (r.value || '').trim();
  });
  // Acepta también los nombres de campo que usa el Sheet actual
  if (config.bootcamp_name && config.event_title === CONFIG_DEFAULTS.event_title) config.event_title = config.bootcamp_name;
  if (!config.event_location && config.city) config.event_location = config.city;
  if (!config.event_dates && config.date_start) config.event_dates = config.date_end ? `${config.date_start} – ${config.date_end}` : config.date_start;

  const items = milestoneRows
    .map(r => ({
      day: parseInt(r.day, 10),
      day_label: (r.day_label || '').trim(),
      order: parseInt(r.order, 10) || 0,
      milestone: (r.milestone || '').trim(),
      status: normalizeStatus(r.status),
      ticker: (r.ticker || '').trim(),
      entities: (r.entities || '').split(/[,;|]/).map(s => s.trim()).filter(Boolean),
      day_summary: (r.day_summary || '').trim()
    }))
    .filter(m => !isNaN(m.day) && m.milestone);

  items.sort((a, b) => a.day - b.day || a.order - b.order);

  const dayMap = new Map();
  items.forEach(m => {
    if (!dayMap.has(m.day)) dayMap.set(m.day, { day: m.day, day_label: m.day_label || ('Day ' + m.day), items: [] });
    const d = dayMap.get(m.day);
    if (!d.day_label && m.day_label) d.day_label = m.day_label;
    if (!d.summary && m.day_summary) d.summary = m.day_summary;
    d.items.push(m);
  });
  const days = [...dayMap.values()].sort((a, b) => a.day - b.day);

  days.forEach(d => {
    const total = d.items.length;
    const done = d.items.filter(m => m.status === 'done').length;
    const active = d.items.some(m => m.status === 'active');
    d.done = done; d.total = total;
    d.status = done === total && total > 0 ? 'done' : (active ? 'active' : (done > 0 ? 'active' : 'pending'));
  });

  const totalAll = items.length;
  const doneAll = items.filter(m => m.status === 'done').length;
  const pct = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;

  let currentDay = days.find(d => d.items.some(m => m.status === 'active'));
  if (!currentDay) currentDay = [...days].reverse().find(d => d.done > 0);
  if (!currentDay) currentDay = days[0];

  const activeMilestone = currentDay ? currentDay.items.find(m => m.status === 'active') : null;
  const lastDoneInDay = currentDay ? [...currentDay.items].reverse().find(m => m.status === 'done') : null;

  return { config, days, items, currentDay, activeMilestone, lastDoneInDay, pct, doneAll, totalAll };
}

/* ── Render ── */
let lastGoodModel = null;
async function render(model) {
  const t = UI[currentLang];
  const { config, days, items, currentDay, activeMilestone, lastDoneInDay, pct } = model;

  setLogos(config);
  applyStaticStrings();

  if (!currentDay) {
    document.getElementById('n-head').textContent = t.noData;
    document.getElementById('n-sub').textContent = t.noDataSub;
    return;
  }

  // Traducimos en lote todo lo que vamos a pintar en esta pasada
  const textsNeeded = [];
  days.forEach(d => textsNeeded.push(d.day_label, d.summary));
  items.forEach(m => textsNeeded.push(m.milestone));
  if (activeMilestone) textsNeeded.push(activeMilestone.ticker, activeMilestone.milestone);
  if (lastDoneInDay) textsNeeded.push(lastDoneInDay.ticker, lastDoneInDay.milestone);
  textsNeeded.push(config.event_title, config.event_location);
  const tr = await buildTranslator(textsNeeded, currentLang);

  document.getElementById('t-logo').textContent =
    [tr(config.event_title), tr(config.event_location), config.event_dates].filter(Boolean).join(' · ');

  const dayIdx = days.findIndex(d => d.day === currentDay.day);
  document.getElementById('day-tag').textContent = tr(currentDay.day_label);
  document.getElementById('pct-hero').textContent = pct + '%';
  document.getElementById('pct-label').textContent = t.dayOf(dayIdx + 1, days.length);
  document.getElementById('prog-fill').style.width = pct + '%';

  document.getElementById('n-head').innerHTML = tr(currentDay.day_label).replace(/^(\S+)/, '<em>$1</em>');
  const narrativeMilestone = activeMilestone || lastDoneInDay;
  document.getElementById('n-sub').textContent = narrativeMilestone
    ? (activeMilestone ? t.inProgress : t.completed) + tr(narrativeMilestone.milestone)
    : t.waitingMilestone;

  const tickerText = (activeMilestone && tr(activeMilestone.ticker)) ||
    (activeMilestone && tr(activeMilestone.milestone)) ||
    (lastDoneInDay && (tr(lastDoneInDay.ticker) || tr(lastDoneInDay.milestone))) ||
    t.waitingTicker;
  document.getElementById('ticker').textContent = tickerText;

  // Objetivos del día actual
  const ol = document.getElementById('obj-list');
  ol.innerHTML = '';
  currentDay.items.forEach(m => {
    const div = document.createElement('div');
    div.className = 'obj ' + m.status;
    div.innerHTML = `<div class="obj-icon ${m.status}">${m.status === 'done' ? '✓' : ''}</div><div><div class="obj-text ${m.status}">${tr(m.milestone)}</div>${entitiesHtml(m.entities, config)}</div>`;
    ol.appendChild(div);
  });

  // Timeline inferior — una celda por día
  const tl = document.getElementById('timeline');
  tl.style.gridTemplateColumns = `repeat(${days.length || 1},1fr)`;
  tl.innerHTML = '';
  days.forEach(d => {
    const div = document.createElement('div');
    div.className = `db ${d.status}`;
    div.innerHTML = `<div class="db-n">${t.dayWord} ${d.day}</div><div class="db-t">${tr(d.day_label)}</div><div class="db-o">${t.doneOf(d.done, d.total)}</div>`;
    tl.appendChild(div);
  });

  renderCredentials(config);
  renderJourney(model, tr);
  drawGraph(items, days, tr);
}

/* ── Gráfico central: un nodo por HITO (milestone), en serpentina ── */
function drawGraph(items, days, tr) {
  const svg = document.getElementById('graph');
  svg.innerHTML = '';
  const n = items.length;
  if (!n) return;

  const W = 540, H = 360, padX = 78, padY = 48;
  const perRow = Math.min(n, Math.max(4, Math.ceil(Math.sqrt(n * 1.7))));
  const rows = Math.ceil(n / perRow);
  const rowH = rows > 1 ? (H - padY * 2) / (rows - 1) : 0;
  const colW = perRow > 1 ? (W - padX * 2) / (perRow - 1) : 0;

  const pts = items.map((m, i) => {
    const row = Math.floor(i / perRow);
    let col = i % perRow;
    if (row % 2 === 1) col = perRow - 1 - col; // serpentina
    const x = padX + col * colW;
    const y = rows > 1 ? padY + row * rowH : H / 2;
    return { x, y, m };
  });

  const ns = 'http://www.w3.org/2000/svg';

  // edges
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    const leadsToActive = a.m.status === 'done' && b.m.status === 'active';
    line.setAttribute('stroke', leadsToActive ? 'var(--gold-text)' : (a.m.status === 'done' ? 'rgba(31,212,160,.45)' : 'rgba(108,111,160,.25)'));
    line.setAttribute('stroke-width', leadsToActive ? '2.4' : '1.8');
    if (leadsToActive) {
      line.setAttribute('stroke-dasharray', '6 6');
      line.setAttribute('stroke-linecap', 'round');
      const flow = document.createElementNS(ns, 'animate');
      flow.setAttribute('attributeName', 'stroke-dashoffset');
      flow.setAttribute('from', '24'); flow.setAttribute('to', '0');
      flow.setAttribute('dur', '1s'); flow.setAttribute('repeatCount', 'indefinite');
      line.appendChild(flow);
    }
    svg.appendChild(line);
  }

  // Inicio y meta: dos insignias sobrias en los extremos del camino
  const [startTxt, finishTxt] = START_FINISH[currentLang] || START_FINISH.en;
  const first = pts[0], last = pts[pts.length - 1];
  const lastRow = Math.floor((pts.length - 1) / perRow);
  const lastDir = lastRow % 2 === 0 ? 1 : -1;
  const startPos = { x: first.x - 52, y: first.y };
  const endPos = { x: last.x + 52 * lastDir, y: last.y };
  const allDone = items.every(m => m.status === 'done');
  const anyStarted = items.some(m => m.status !== 'pending');

  function connector(a, b, color) {
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
    l.setAttribute('stroke', color); l.setAttribute('stroke-width', '1.8'); l.setAttribute('stroke-dasharray', '2 5'); l.setAttribute('stroke-linecap', 'round');
    svg.appendChild(l);
  }
  function badge(pos, color, fill, iconPath, label) {
    const g = document.createElementNS(ns, 'g');
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', pos.x); c.setAttribute('cy', pos.y); c.setAttribute('r', 19);
    c.setAttribute('fill', fill); c.setAttribute('stroke', color); c.setAttribute('stroke-width', '2');
    g.appendChild(c);
    const icon = document.createElementNS(ns, 'path');
    icon.setAttribute('d', iconPath);
    icon.setAttribute('transform', `translate(${pos.x - 9} ${pos.y - 9})`);
    icon.setAttribute('fill', 'none'); icon.setAttribute('stroke', fill === 'var(--white)' ? color : 'var(--white)');
    icon.setAttribute('stroke-width', '1.8'); icon.setAttribute('stroke-linecap', 'round'); icon.setAttribute('stroke-linejoin', 'round');
    g.appendChild(icon);
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('class', 'gday-marker');
    t.setAttribute('x', pos.x); t.setAttribute('y', pos.y + 36);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', color);
    t.textContent = label;
    g.appendChild(t);
    svg.appendChild(g);
  }
  connector(startPos, first, anyStarted ? 'rgba(31,212,160,.6)' : 'rgba(108,111,160,.35)');
  connector(last, endPos, allDone ? 'rgba(31,212,160,.6)' : 'rgba(108,111,160,.35)');
  // Inicio: pin de ubicación · Meta: bandera
  badge(startPos, anyStarted ? 'var(--teal-text)' : 'var(--pending)', anyStarted ? 'var(--teal)' : 'var(--white)',
    'M9 16.5s-5.5-5-5.5-9a5.5 5.5 0 0 1 11 0c0 4-5.5 9-5.5 9z M9 9.3a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6z', startTxt);
  badge(endPos, allDone ? 'var(--teal-text)' : 'var(--gold-text)', allDone ? 'var(--teal)' : 'var(--white)',
    'M4 16.5V2.5 M4 3h10l-2.5 3.5L14 10H4', finishTxt);

  // day-boundary markers (small label above the first milestone of each new day)
  let lastDay = null;
  pts.forEach(p => {
    if (p.m.day !== lastDay) {
      lastDay = p.m.day;
      const dInfo = days.find(d => d.day === p.m.day);
      const marker = document.createElementNS(ns, 'text');
      marker.setAttribute('class', 'gday-marker');
      marker.setAttribute('x', p.x); marker.setAttribute('y', p.y - 22 < 14 ? p.y + 32 : p.y - 22);
      marker.setAttribute('text-anchor', 'middle');
      marker.setAttribute('fill', 'var(--gold-text)');
      marker.textContent = dInfo ? tr(dInfo.day_label) : (UI[currentLang].dayWord + ' ' + p.m.day);
      svg.appendChild(marker);
    }
  });

  // nodes
  pts.forEach(p => {
    const status = p.m.status;
    const color = status === 'done' ? 'var(--teal)' : status === 'active' ? 'var(--gold-text)' : 'var(--pending)';
    const g = document.createElementNS(ns, 'g');

    if (status === 'active') {
      // Ondas que se expanden
      [0, 1].forEach(k => {
        const ripple = document.createElementNS(ns, 'circle');
        ripple.setAttribute('cx', p.x); ripple.setAttribute('cy', p.y); ripple.setAttribute('r', 10);
        ripple.setAttribute('fill', 'none'); ripple.setAttribute('stroke', 'var(--gold-text)'); ripple.setAttribute('stroke-width', '1.5');
        ripple.innerHTML = `<animate attributeName="r" values="10;30" dur="2.4s" begin="${k * 1.2}s" repeatCount="indefinite"/>` +
          `<animate attributeName="stroke-opacity" values=".55;0" dur="2.4s" begin="${k * 1.2}s" repeatCount="indefinite"/>`;
        g.appendChild(ripple);
      });
      // Anillo de trazos que gira alrededor del nodo
      const ring = document.createElementNS(ns, 'circle');
      ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y); ring.setAttribute('r', 17);
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', 'var(--gold-text)'); ring.setAttribute('stroke-width', '2');
      ring.setAttribute('stroke-dasharray', '5 6'); ring.setAttribute('stroke-linecap', 'round');
      ring.innerHTML = `<animateTransform attributeName="transform" type="rotate" from="0 ${p.x} ${p.y}" to="360 ${p.x} ${p.y}" dur="6s" repeatCount="indefinite"/>`;
      g.appendChild(ring);
    }
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', status === 'active' ? 10 : 9);
    circle.setAttribute('fill', status === 'done' ? color : (status === 'active' ? 'rgba(255,214,107,.55)' : 'var(--ink)'));
    circle.setAttribute('stroke', color);
    circle.setAttribute('stroke-width', status === 'pending' ? '1.5' : '2.2');
    g.appendChild(circle);

    if (status === 'active') {
      const label = document.createElementNS(ns, 'text');
      label.setAttribute('class', 'gnode-label');
      label.setAttribute('x', p.x); label.setAttribute('y', p.y + 40);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('fill', 'var(--text)');
      const shortText = tr(p.m.milestone).length > 22 ? tr(p.m.milestone).slice(0, 21) + '…' : tr(p.m.milestone);
      label.textContent = shortText;
      g.appendChild(label);
    }

    svg.appendChild(g);
  });
}

/* ── Fondo animado (partículas) ── */
const canvas = document.getElementById('bg'), ctx = canvas.getContext('2d');
let W, H, bgPts = [];
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
function initBg() { bgPts = []; for (let i = 0; i < 50; i++) bgPts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .1, vy: (Math.random() - .5) * .1, r: Math.random() * 1.1 + .3, a: Math.random() * .22 + .04 }); }
function drawBg() {
  ctx.clearRect(0, 0, W, H);
  bgPts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(30,28,36,${p.a})`; ctx.fill();
  });
  bgPts.forEach((a, i) => bgPts.slice(i + 1).forEach(b => {
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 80) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.strokeStyle = `rgba(30,28,36,${.05 * (1 - d / 80)})`; ctx.lineWidth = .4; ctx.stroke(); }
  }));
  requestAnimationFrame(drawBg);
}
window.addEventListener('resize', () => { resize(); initBg(); });
resize(); initBg(); drawBg();

function tick() {
  const d = new Date();
  const locale = { es: 'es-ES', en: 'en-US', pt: 'pt-BR', fr: 'fr-FR', id: 'id-ID' }[currentLang] || 'en-US';
  document.getElementById('clock').textContent =
    d.toLocaleDateString(locale, { month: 'long', day: 'numeric', year: 'numeric' }) +
    '  ' + d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 30000);

/* ── Carga en vivo desde el Sheet ── */
async function loadLive() {
  try {
    if (!SPREADSHEET_ID || SPREADSHEET_ID === 'PEGA_AQUI_EL_ID_DEL_SHEET') {
      throw new Error('falta configurar SPREADSHEET_ID en el código');
    }
    const [configRows, milestoneRows] = await Promise.all([
      loadGvizTab(CONFIG_GID),
      loadGvizTab(MILESTONES_GID)
    ]);
    const model = buildModel(configRows, milestoneRows);
    const newlyDone = detectNewlyDone(model.items);
    lastGoodModel = model;
    document.getElementById('t-live').classList.remove('stale');
    await render(model);
    if (newlyDone.length) celebrate(newlyDone);
  } catch (e) {
    console.error('loadLive error:', e);
    document.getElementById('t-live').classList.add('stale');
    document.getElementById('t-live-label').textContent = UI[currentLang].stale;
    if (!lastGoodModel) {
      document.getElementById('n-head').textContent = UI[currentLang].connError;
      document.getElementById('n-sub').textContent = UI[currentLang].connErrorSub + e.message;
    }
  }
}

/* ── Entidades: columna "entities" en milestones (ej. "BSSN, Dukcapil").
   Logo opcional: fila en config con field "logo:BSSN" y un link público.
   Sin logo se muestra un avatar con las iniciales. ── */
const ENT_COLORS = ['#5A5D96', '#0C7A5C', '#B5541C', '#9C6A00', '#4D6FBF', '#8B4A8B'];
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function entitiesHtml(list, config) {
  if (!list || !list.length) return '';
  return '<div class="ents">' + list.map(name => {
    let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const color = ENT_COLORS[h % ENT_COLORS.length];
    const initials = name.split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
    const logo = toImageUrl(config['logo:' + name.toLowerCase()] || config['logo:' + name] || '');
    const av = logo
      ? `<span class="ent-av" style="background:${color}"><img src="${escapeHtml(logo)}" alt="" onerror="this.remove()"></span>`
      : `<span class="ent-av" style="background:${color}">${escapeHtml(initials)}</span>`;
    return `<span class="ent">${av}${escapeHtml(name)}</span>`;
  }).join('') + '</div>';
}

/* ── Contador: fila "credentials_issued" en config ── */
let credShown = null;
function renderCredentials(config) {
  const box = document.getElementById('cred-box');
  const raw = (config.credentials_issued || '').replace(/[^\d]/g, '');
  document.getElementById('cred-tag').textContent = (EXTRA[currentLang] || EXTRA.en).creds;
  if (raw === '') { box.classList.remove('on'); return; }
  box.classList.add('on');
  const target = parseInt(raw, 10);
  const el = document.getElementById('cred-num');
  if (credShown === null) { credShown = target; el.textContent = target.toLocaleString(); return; }
  if (target === credShown) return;
  const from = credShown, start = performance.now(), dur = 1200;
  const up = target > from;
  credShown = target;
  (function step(now) {
    const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (target - from) * e).toLocaleString();
    if (k < 1) requestAnimationFrame(step);
  })(start);
  if (up) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); burst(90); }
}

/* ── Celebración cuando un hito pasa a Done ── */
let prevStatus = null;
function detectNewlyDone(items) {
  const now = new Map(items.map(m => [m.day + '|' + m.order + '|' + m.milestone, m.status]));
  const fresh = prevStatus ? items.filter(m => m.status === 'done' && prevStatus.get(m.day + '|' + m.order + '|' + m.milestone) !== 'done') : [];
  prevStatus = now;
  return fresh;
}
let toastTimer = null;
function celebrate(list) {
  const ex = EXTRA[currentLang] || EXTRA.en;
  const m = list[list.length - 1];
  const text = translationCache.get(currentLang + '::' + m.milestone) || m.milestone;
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast'; toast.className = 'toast';
    toast.innerHTML = '<div class="toast-icon">✓</div><div><div class="toast-k"></div><div class="toast-t"></div></div>';
    document.body.appendChild(toast);
  }
  toast.querySelector('.toast-k').textContent = ex.reached;
  toast.querySelector('.toast-t').textContent = text + (list.length > 1 ? ex.more(list.length - 1) : '');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 6000);
  burst(220);
}

const cf = document.createElement('canvas'); cf.id = 'confetti'; document.body.appendChild(cf);
const cfx = cf.getContext('2d');
let cfParts = [], cfRunning = false;
function sizeCf() { cf.width = innerWidth; cf.height = innerHeight; }
sizeCf(); window.addEventListener('resize', sizeCf);
function burst(n) {
  const colors = ['#FFD66B', '#1FD4A0', '#4D9DFF', '#8B8AE8', '#FFA06B', '#ff6b6b'];
  for (let i = 0; i < n; i++) {
    const fromLeft = i % 2 === 0;
    cfParts.push({
      x: fromLeft ? -10 : cf.width + 10, y: cf.height * (0.55 + Math.random() * 0.3),
      vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 9), vy: -(9 + Math.random() * 11),
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      c: colors[i % colors.length], life: 0
    });
  }
  if (!cfRunning) { cfRunning = true; requestAnimationFrame(cfStep); }
}
function cfStep() {
  cfx.clearRect(0, 0, cf.width, cf.height);
  cfParts.forEach(p => {
    p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    cfx.save(); cfx.translate(p.x, p.y); cfx.rotate(p.rot);
    cfx.globalAlpha = Math.max(0, 1 - p.life / 220);
    cfx.fillStyle = p.c; cfx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cfx.restore();
  });
  cfParts = cfParts.filter(p => p.y < cf.height + 40 && p.life < 220);
  if (cfParts.length) requestAnimationFrame(cfStep);
  else { cfRunning = false; cfx.clearRect(0, 0, cf.width, cf.height); }
}

/* ── Vista recorrido ──
   Usa los mismos datos de milestones. Columna opcional "day_summary":
   una frase por día (basta en la primera fila de cada día). */
let currentView = 'live';
function setView(v) {
  currentView = v;
  document.body.classList.toggle('view-journey', v === 'journey');
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  try { history.replaceState(null, '', v === 'journey' ? '#journey' : '#'); } catch (e) {}
  if (v === 'journey') document.querySelectorAll('.j-day').forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
}
function renderJourney(model, tr) {
  const vt = VIEW_TXT[currentLang] || VIEW_TXT.en;
  const t = UI[currentLang];
  document.querySelectorAll('.view-btn').forEach(b => b.textContent = vt[b.dataset.view]);
  const { config, days, currentDay } = model;
  document.getElementById('j-kicker').textContent =
    [tr(config.event_title), tr(config.event_location), config.event_dates].filter(Boolean).join(' · ');
  document.getElementById('j-title').textContent = vt.title;
  const jl = document.getElementById('j-logo'), pl = document.getElementById('logo-partner');
  if (pl && pl.classList.contains('ok') && !jl.classList.contains('ok')) { jl.src = pl.src; jl.classList.add('ok'); }
  else if (!jl.classList.contains('ok') && EMBEDDED_LOGOS['logo-partner']) { jl.src = EMBEDDED_LOGOS['logo-partner']; jl.classList.add('ok'); }

  // Tarjetas por día
  const wrap = document.getElementById('j-days');
  wrap.style.gridTemplateColumns = `repeat(${days.length || 1},1fr)`;
  wrap.innerHTML = '';
  days.forEach((d, i) => {
    const isToday = currentDay && d.day === currentDay.day && d.status !== 'done';
    const label = tr(d.day_label);
    const title = label.includes('·') ? label.split('·').pop().trim() : label;
    const card = document.createElement('div');
    card.className = 'j-day ' + (isToday ? 'active' : d.status);
    card.style.setProperty('--i', i);
    const badge = isToday ? vt.today : (d.status === 'done' ? '✓ ' + vt.done : '');
    card.innerHTML =
      `<div class="j-ghost">${d.day}</div>` +
      `<div class="j-n">${t.dayWord} ${d.day}<span class="j-badge">${badge}</span></div>` +
      `<div class="j-t">${escapeHtml(title)}</div>` +
      (d.summary ? `<div class="j-sum">${escapeHtml(tr(d.summary))}</div>` : '') +
      `<div class="j-list">` + d.items.map(m =>
        `<div class="j-item ${m.status}"><div class="j-dot">${m.status === 'done' ? '✓' : ''}</div><div>${escapeHtml(tr(m.milestone))}${entitiesHtml(m.entities, config)}</div></div>`
      ).join('') + `</div>`;
    wrap.appendChild(card);
  });

  // Línea de recorrido: inicio → un punto por día → meta
  const svg = document.getElementById('j-track');
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const n = days.length; if (!n) return;
  const [startTxt, finishTxt] = START_FINISH[currentLang] || START_FINISH.en;
  const xs = days.map((d, i) => ((i + 0.5) / n) * 1000);
  const y = 30;
  const doneUpTo = days.reduce((acc, d, i) => d.status === 'done' ? i : acc, -1);
  const curIdx = currentDay ? days.findIndex(d => d.day === currentDay.day) : -1;
  const progX = curIdx >= 0 ? xs[curIdx] : (doneUpTo >= 0 ? xs[doneUpTo] : 0);
  const mk = (tag, attrs) => { const el = document.createElementNS(ns, tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); svg.appendChild(el); return el; };
  mk('line', { x1: 0, y1: y, x2: 1000, y2: y, stroke: 'rgba(108,111,160,.3)', 'stroke-width': 2, 'stroke-dasharray': '3 6', 'vector-effect': 'non-scaling-stroke' });
  const prog = mk('line', { x1: 0, y1: y, x2: progX, y2: y, stroke: 'var(--teal)', 'stroke-width': 3, 'vector-effect': 'non-scaling-stroke' });
  prog.innerHTML = `<animate attributeName="x2" from="0" to="${progX}" dur="1.2s" fill="freeze"/>`;
  // los puntos y etiquetas van en HTML superpuesto para no deformarse con el SVG estirado
  let overlay = document.getElementById('j-track-ov');
  if (!overlay) {
    overlay = document.createElement('div'); overlay.id = 'j-track-ov';
    overlay.style.cssText = 'position:relative;height:0';
    svg.after(overlay);
  }
  overlay.innerHTML = '';
  const dot = (leftPct, html, color, fill, extra) => {
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;left:${leftPct}%;top:-48px;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid ${color};background:${fill};display:flex;align-items:center;justify-content:center;color:${fill === 'var(--white)' ? color : '#fff'};font-size:12px;font-weight:700;font-family:'Fraunces',serif;${extra || ''}`;
    el.innerHTML = html; overlay.appendChild(el); return el;
  };
  const pin = '<svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 16.5s-5.5-5-5.5-9a5.5 5.5 0 0 1 11 0c0 4-5.5 9-5.5 9z"/></svg>';
  const flag = '<svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16.5V2.5 M4 3h10l-2.5 3.5L14 10H4"/></svg>';
  const allDone = days.every(d => d.status === 'done');
  const s = dot(0, pin, 'var(--teal-text)', 'var(--teal)'); s.title = startTxt;
  days.forEach((d, i) => {
    const today = i === curIdx && d.status !== 'done';
    const color = d.status === 'done' ? 'var(--teal)' : today ? 'var(--gold-text)' : 'var(--pending)';
    const fill = d.status === 'done' ? 'var(--teal)' : today ? 'var(--gold)' : 'var(--white)';
    dot((xs[i] / 10), d.status === 'done' ? '✓' : String(d.day), color, fill,
      today ? 'box-shadow:0 0 0 6px rgba(255,214,107,.35),0 0 0 14px rgba(255,214,107,.15);color:var(--text)' : '');
  });
  dot(100, flag, allDone ? 'var(--teal-text)' : 'var(--gold-text)', allDone ? 'var(--teal)' : 'var(--white)');
}
document.addEventListener('keydown', e => { if ((e.key === 'j' || e.key === 'J') && !e.ctrlKey && !e.metaKey) setView(currentView === 'journey' ? 'live' : 'journey'); });
if (location.hash === '#journey') setView('journey');

/* ── Pantalla completa: botón ⛶ o tecla F; el cursor se oculta solo ── */
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) toggleFullscreen(); });
let idleTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
});

applyStaticStrings();
loadLive();
setInterval(loadLive, REFRESH_MS);
</script>
